apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: changeguard
  namespace: argocd
spec:
  description: GitOps deployment for ChangeGuard AI
  sourceRepos:
    - 'https://github.com/quantum-vector/changeguard-ai.git'
  destinations:
    - namespace: changeguard
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
